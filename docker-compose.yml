# CropCare AI - 로컬/단일 호스트 배포
#
#   docker compose up -d --build
#   → http://localhost:3000
#
# 브라우저는 프론트엔드 오리진 하나만 호출한다. /api 와 /uploads 는 Next.js의
# rewrite가 backend 컨테이너로 프록시하므로 백엔드 포트를 외부에 열 필요도,
# CORS를 설정할 필요도 없다.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/cropcare.db
      UPLOAD_DIR: /data/uploads
      ML_MODEL_PATH: /models/best_model.pth
      MAX_UPLOAD_MB: "10"
      # 브라우저가 백엔드를 직접 부르지 않으므로 실제로 쓰이지 않는다.
      # 백엔드를 별도 도메인으로 노출한다면 프론트 도메인으로 바꿀 것.
      CORS_ORIGINS: http://localhost:3000
    volumes:
      # 학습된 체크포인트(best_model.pth, pair_mu.pth)는 저장소에 없다.
      # 파일이 없으면 백엔드는 Mock 모드로 뜬다 (/api/v1/health 로 확인).
      - ./ml/checkpoints:/models:ro
      # SQLite 파일과 업로드 이미지 — 컨테이너를 다시 만들어도 보존된다
      - cropcare-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # 첫 기동에 모델 로드 시간이 필요하다
      retries: 3

  frontend:
    # BACKEND_ORIGIN은 environment가 아니라 build.args로 준다.
    # Next.js standalone은 rewrite 목적지를 빌드 시점에 굳혀 넣으므로 런타임
    # 환경변수로는 바꿀 수 없다 (frontend/Dockerfile 주석 참고).
    # 값을 바꾸려면 `docker compose up -d --build` 로 다시 빌드해야 한다.
    build:
      context: ./frontend
      args:
        # 컨테이너 이름으로 백엔드를 찾는다 (compose 내부 DNS)
        BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  cropcare-data:
